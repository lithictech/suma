<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=4,user-scalable=yes">
  <meta name="description" content="<%= meta_description %>">
  <title>Suma</title>
  <!-- Android  -->
  <meta name="theme-color" content="#CDA671FF">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- iOS -->
  <meta name="apple-mobile-web-app-title" content="Suma">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- Pinned Sites  -->
  <meta name="application-name" content="Suma">
  <!-- UC Mobile Browser  -->
  <meta name="full-screen" content="yes">
  <meta name="browsermode" content="application">
  <!-- Layout mode -->
  <meta name="layoutmode" content="fitscreen">

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="57x57" href="/icons/apple-touch-icon-57x57.png" />
  <link rel="apple-touch-icon" sizes="72x72" href="/icons/apple-touch-icon-72x72.png" />
  <link rel="apple-touch-icon" sizes="76x76" href="/icons/apple-touch-icon-76x76.png" />
  <link rel="apple-touch-icon" sizes="114x114" href="/icons/apple-touch-icon-114x114.png" />
  <link rel="apple-touch-icon" sizes="120x120" href="/icons/apple-touch-icon-120x120.png" />
  <link rel="apple-touch-icon" sizes="144x144" href="/icons/apple-touch-icon-144x144.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152x152.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180x180.png" />
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/index.jsx"></script>
<script type="text/javascript" data-csp="ok">
  // AddToHomeScreen service worker must register here.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("%BASE_URL%/add-to-homescreen-service-worker.js", { scope: "%BASE_URL%" })
        .catch((error) => error);
    });
  }
</script>
<script type="text/javascript" data-csp="ok">
  // See commit this code was added in for an explanation.
  (function() {
    const hashedIndexJs = (document.querySelector('script[src*="assets/index"]') || {}).src
    if (!hashedIndexJs) {
      return;
    }
    fetch(hashedIndexJs, { method: "HEAD" })
      .then((r) => r.status >= 300 ? Promise.reject(`Server Error: ${r.status}`) : null)
      .catch((e) => {
        console.warn(`Suma failed to load ${hashedIndexJs}`, e);
        // The app (and its localization) has not loaded, so this message is always English.
        // Mark it up so assistive technology announces it, in the right language.
        const content = document.createElement("div");
        content.style.padding = "30px";
        content.setAttribute("role", "alert");
        content.setAttribute("lang", "en");
        const message = document.createElement("p");
        content.appendChild(message);
        if (!window.location.href.includes("clearcache=")) {
          console.warn("Suma reloading with clearcache to bust the cache.");
          // Wait before reloading so the message can be read,
          // and let the user reload right away, or stop the automatic reload.
          const reloadDelaySeconds = 5;
          const reload = () => {
            window.location = window.location.href + "?clearcache=" + Date.now();
          };
          message.innerText = `This application has been updated. The page will reload in ${reloadDelaySeconds} seconds. If it does not, use the button below, or your browser menu, to reload the page.`;
          const makeButton = (text) => {
            const button = document.createElement("button");
            button.type = "button";
            button.innerText = text;
            button.style.minHeight = "44px";
            button.style.minWidth = "44px";
            button.style.padding = "8px 16px";
            button.style.marginRight = "12px";
            button.style.marginBottom = "12px";
            button.style.fontSize = "1rem";
            return button;
          };
          const reloadButton = makeButton("Reload now");
          const stopButton = makeButton("Do not reload automatically");
          const timer = window.setTimeout(reload, reloadDelaySeconds * 1000);
          reloadButton.addEventListener("click", () => {
            window.clearTimeout(timer);
            reload();
          });
          stopButton.addEventListener("click", () => {
            window.clearTimeout(timer);
            message.innerText = "This application has been updated. Use the button below, or your browser menu, to reload the page.";
            stopButton.remove();
            reloadButton.focus();
          });
          content.appendChild(reloadButton);
          content.appendChild(stopButton);
          document.body.appendChild(content);
        } else {
          console.warn("Suma reloaded due to stale cache, but JS still not found. Not reloading.");
          message.innerText = "Sorry, something went wrong loading the application. You can try refreshing, or reach out to info@mysuma.org.";
          document.body.appendChild(content);
        }
      });
  })();
</script>
</body>
</html>
